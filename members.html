<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>團隊成員 | 奈米感測實驗室</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .members-layout { display: flex; gap: 3rem; margin-top: 2rem; align-items: flex-start; }
        
        /* 左側選單樣式 */
        .member-tabs { width: 220px; flex-shrink: 0; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); overflow: hidden; }
        .member-tab-btn { width: 100%; padding: 15px 20px; border: none; background: none; text-align: left; font-size: 1rem; color: #555; cursor: pointer; border-left: 4px solid transparent; transition: 0.2s; }
        .member-tab-btn:hover { background-color: #f8f9fa; color: var(--primary-purple); }
        .member-tab-btn.active { border-left-color: var(--primary-purple); color: var(--primary-purple); background-color: #f3e5f5; font-weight: bold; }
        
        /* 右側成員內容區塊 */
        .member-content-area { flex-grow: 1; }
        .group-section { margin-bottom: 2.5rem; }
        .group-header { font-size: 1.3rem; color: #333; margin-bottom: 1.5rem; border-bottom: 2px solid #eee; padding-bottom: 0.5rem; }
        
        .member-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; }
        .member-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); text-align: center; border: 1px solid #eee; transition: transform 0.2s; }
        .member-card:hover { transform: translateY(-3px); }
        .member-photo { width: 100%; height: 220px; object-fit: cover; background: #f0f0f0; }
        .member-info { padding: 15px; }
        .member-name { font-size: 1.1rem; font-weight: bold; color: #222; margin-bottom: 5px; }
        .member-role { font-size: 0.85rem; color: #666; }

        @media (max-width: 768px) {
            .members-layout { flex-direction: column; }
            .member-tabs { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- 導覽列 -->
    <nav>
        <div class="logo"><a href="index.html"><img src="images/logo.png" alt="奈米感測實驗室"></a></div>
        <ul>
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於實驗室</a></li>
            <li><a href="professor.html">指導教授</a></li>
            <li><a href="members.html" class="active">團隊成員</a></li>
            <li><a href="research.html">研究成果</a></li>
        </ul>
    </nav>

    <!-- 主內容區塊 -->
    <section class="page-section gray-bg">
        <h2 class="section-title">團隊成員</h2>
        
        <div class="members-layout">
            <!-- 左側側邊欄動態選單 -->
            <div class="member-tabs" id="menu-tab-container">
                <button class="member-tab-btn">載入中...</button>
            </div>

            <!-- 右側成員名單展示區 -->
            <div class="member-content-area" id="member-display-area">
                <p style="color: #666;">資料載入中...</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="copyright"><p>&copy; 2026 國立臺南大學 電機工程學系 奈米感測實驗室. All Rights Reserved.</p></div>
    </footer>

    <!-- 動態串接與自動分類腳本 -->
    <script>
        const scriptUrl = "https://script.google.com/macros/s/AKfycby6nER3S_UDSxUI6xuf5dh3erxRL4eqDlDSgIz09OL9f4PhDTuV8CS2X_8RDsoEAAGmOA/exec?sheet=團隊成員";

        // Google Drive 圖片防呆解析函式
        function getDriveImageUrl(rawUrl) {
            if (!rawUrl) return 'https://via.placeholder.com/200x220?text=Member';
            if (rawUrl.includes('drive.google.com')) {
                const match = rawUrl.match(/[-\w]{25,}/);
                return match ? `https://drive.google.com/thumbnail?id=${match[0]}&sz=w600` : rawUrl;
            }
            return rawUrl;
        }

        let allMembersData = [];

        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                allMembersData = data;
                const tabContainer = document.getElementById('menu-tab-container');
                
                // 1. 抓取所有不重複的 menu_group 作為左側分類按鈕
                const groups = [...new Set(data.map(item => item.menu_group).filter(g => g))];
                
                if (groups.length === 0) {
                    document.getElementById('member-display-area').innerHTML = '<p>目前尚無成員資料。</p>';
                    tabContainer.innerHTML = '';
                    return;
                }

                tabContainer.innerHTML = '';

                // 2. 建立側邊按鈕
                groups.forEach((groupName, index) => {
                    const btn = document.createElement('button');
                    btn.className = `member-tab-btn ${index === 0 ? 'active' : ''}`;
                    btn.textContent = groupName;
                    btn.onclick = () => {
                        document.querySelectorAll('.member-tab-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderGroupMembers(groupName);
                    };
                    tabContainer.appendChild(btn);
                });

                // 3. 預設顯示第一個分類的成員名單
                renderGroupMembers(groups[0]);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('member-display-area').innerHTML = '<p>資料載入失敗，請確認 API 權限或稍後再試。</p>';
            });

        // 渲染指定分類下的成員名單
        function renderGroupMembers(groupName) {
            const displayArea = document.getElementById('member-display-area');
            displayArea.innerHTML = '';

            // 篩選屬於該分類的所有資料
            const members = allMembersData.filter(item => item.menu_group === groupName);

            // 抓取該分類下所有次標題（如：碩班、大四）
            const subTitles = [...new Set(members.map(m => m.sub_title).filter(s => s))];

            if (subTitles.length === 0) {
                // 如果沒有設定次標題，直接平鋪顯示卡片
                displayArea.appendChild(createCardsGrid(members));
                return;
            }

            // 依次標題分組渲染
            subTitles.forEach(sub => {
                const subMembers = members.filter(m => m.sub_title === sub);
                
                const groupSection = document.createElement('div');
                groupSection.className = 'group-section';

                const header = document.createElement('h3');
                header.className = 'group-header';
                header.textContent = sub;
                groupSection.appendChild(header);

                groupSection.appendChild(createCardsGrid(subMembers));
                displayArea.appendChild(groupSection);
            });
        }

        // 建立名片網格函式
        function createCardsGrid(memberList) {
            const grid = document.createElement('div');
            grid.className = 'member-cards-grid';

            memberList.forEach(m => {
                const photoSrc = getDriveImageUrl(m.image);
                const card = document.createElement('div');
                card.className = 'member-card';
                card.innerHTML = `
                    <img src="${photoSrc}" alt="${m.name}" class="member-photo" onerror="this.src='https://via.placeholder.com/200x220?text=Member'">
                    <div class="member-info">
                        <div class="member-name">${m.name}</div>
                        <div class="member-role">${m.role || ''}</div>
                    </div>
                `;
                grid.appendChild(card);
            });

            return grid;
        }
    </script>
</body>
</html>
