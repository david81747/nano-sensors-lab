<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新消息 | 奈米感測實驗室</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .article-container { max-width: 900px; margin: 4rem auto; padding: 3rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .article-title { font-size: 2rem; color: var(--primary-purple); margin-bottom: 1rem; line-height: 1.3; font-weight: bold; }
        .article-date { color: #888; font-size: 0.95rem; margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        
        .back-btn { display: inline-block; margin-top: 2rem; padding: 10px 20px; background: var(--accent-pink); color: #fff; text-decoration: none; border-radius: 4px; transition: 0.3s; text-align: center; }
        .back-btn:hover { background: #d81b60; }
        
        /* 載入動畫 */
        .loader-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-purple); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ================= 徹底消滅 iframe：純原生內容排版 ================= */
        #dynamic-content-area {
            width: 100%;
            color: var(--text-main);
            font-size: 1.1rem;
            line-height: 2;
        }
        /* 強制拔除 Google Docs 帶來的死板寬度與灰色背景 */
        #dynamic-content-area * {
            max-width: 100% !important;
            height: auto !important;
            box-sizing: border-box !important;
            background-color: transparent !important;
        }
        /* 強制自動換行，絕不撐破螢幕 */
        #dynamic-content-area p, 
        #dynamic-content-area span,
        #dynamic-content-area div {
            white-space: normal !important;
            word-wrap: break-word !important;
        }
        /* 圖片圓角與置中，看起來更像原生網站 */
        #dynamic-content-area img {
            display: block;
            margin: 1.5rem auto;
            border-radius: 8px;
        }
        /* 表格處理：手機上可左右滑動，不破壞排版 */
        #dynamic-content-area table {
            width: 100% !important;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-collapse: collapse;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        /* ================= 手機版專屬優化 ================= */
        @media (max-width: 768px) {
            .page-section { padding-left: 0 !important; padding-right: 0 !important; }
            .article-container { margin: 0 !important; padding: 25px 20px !important; border-radius: 0; box-shadow: none; }
            .article-title { font-size: 1.6rem; }
            #dynamic-content-area { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html"><img src="images/logo.png" alt="奈米感測實驗室"></a></div>
        <div class="menu-toggle" id="mobile-menu">☰</div>
        <ul id="nav-menu">
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於實驗室</a></li>
            <li><a href="professor.html">指導教授</a></li>
            <li><a href="members.html">團隊成員</a></li>
            <li><a href="research.html">研究成果</a></li>
        </ul>
    </nav>

    <section class="page-section gray-bg">
        <div class="article-container" id="article-body">
            <div style="text-align: center; padding: 3rem 0;">
                <div class="loader-spinner"></div>
                <p style="color: #666; margin-top: 15px;">文章載入中...</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="sponsors-area">
            <h4>產學合作 / 合作廠商</h4>
            <div class="sponsor-logos">
                <div>廠商 Logo 1</div><div>廠商 Logo 2</div>
            </div>
        </div>
        <div class="footer-divider"></div>
        <div class="contact-area">
            <h4>聯絡我們</h4>
            <div class="contact-info-row">
                <p>電話：06-2606123 # 7012</p>
                <p>信箱：shwu@mail.nutn.edu.tw</p>
                <p>地址：701臺南市東區榮譽街67號 ZA107-2室 (榮譽校區)</p>
            </div>
        </div>
        <div class="copyright"><p>&copy; 2026 國立臺南大學 電機工程學系 奈米感測實驗室. All Rights Reserved.</p></div>
    </footer>

    <script>
        // 漢堡選單邏輯
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');
        if(mobileMenu && navMenu) {
            mobileMenu.addEventListener('click', () => { navMenu.classList.toggle('active'); });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const articleTitle = urlParams.get('title');
        const scriptUrl = "https://script.google.com/macros/s/AKfycby6nER3S_UDSxUI6xuf5dh3erxRL4eqDlDSgIz09OL9f4PhDTuV8CS2X_8RDsoEAAGmOA/exec";

        // 渲染外框函數
        function renderArticleFrame(articleData) {
            let dateStr = "";
            if (articleData.date) {
                const d = new Date(articleData.date);
                dateStr = isNaN(d.getTime()) ? articleData.date : d.toLocaleDateString('zh-TW');
            }

            document.getElementById('article-body').innerHTML = `
                <h1 class="article-title">${articleData.title}</h1>
                <div class="article-date">${dateStr}</div>
                <div id="dynamic-content-area">
                    <div style="text-align: center; padding: 2rem 0;">內容讀取中...</div>
                </div>
                <div style="text-align: center; margin-top: 3rem; margin-bottom: 1rem;">
                    <a href="index.html#news" class="back-btn">回最新消息</a>
                </div>
            `;
        }

        // 開始抓取資料
        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                const article = data.find(item => item.title === articleTitle);
                if (!article) {
                    document.getElementById('article-body').innerHTML = '<h2>找不到該篇文章</h2><a href="index.html#news" class="back-btn">回首頁</a>';
                    return;
                }

                // 先把標題和日期畫出來
                renderArticleFrame(article);
                const contentArea = document.getElementById('dynamic-content-area');
                let targetUrl = article.link;

                // 備用按鈕 (如果擷取失敗，改給直接連結)
                const fallbackButton = `
                    <div style="text-align: center; padding: 2rem;">
                        <p style="color: #666; margin-bottom: 15px;">此文章不支援直接內嵌，請點擊下方按鈕閱讀。</p>
                        <a href="${targetUrl}" target="_blank" style="background-color: #f3c623; color: #222; padding: 10px 25px; border-radius: 30px; font-weight: bold; text-decoration: none;">📄 開啟文章</a>
                    </div>`;

                if (targetUrl && targetUrl.includes('/pub')) {
                    // 【加速機制】檢查快取
                    const cacheKey = `pure_html_${articleTitle}`;
                    const cachedHtml = sessionStorage.getItem(cacheKey);

                    if (cachedHtml) {
                        contentArea.innerHTML = cachedHtml; // 秒開
                    } else {
                        // 使用 Proxy 直接抓取代碼
                        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                        
                        fetch(proxyUrl)
                            .then(res => res.text())
                            .then(rawHtml => {
                                // 將 HTML 字串轉成真實的 DOM 節點
                                const parser = new DOMParser();
                                const doc = parser.parseFromString(rawHtml, 'text/html');
                                
                                // 鎖定 Google Docs 裝載真實內容的區塊 id="contents"
                                const extractedContent = doc.querySelector('#contents');
                                
                                if(extractedContent) {
                                    // 徹底拔除 iframe，直接把內容貼進我們的 div 裡面
                                    const finalPureHTML = extractedContent.innerHTML;
                                    contentArea.innerHTML = finalPureHTML;
                                    sessionStorage.setItem(cacheKey, finalPureHTML); // 存入快取
                                } else {
                                    contentArea.innerHTML = fallbackButton;
                                }
                            })
                            .catch(err => {
                                contentArea.innerHTML = fallbackButton;
                            });
                    }
                } else {
                    // 不是發布到網路的網址，不冒險嵌入，直接給按鈕
                    contentArea.innerHTML = fallbackButton;
                }
            })
            .catch(error => {
                document.getElementById('article-body').innerHTML = '<p>資料載入失敗，請確認網路連線。</p>';
            });
    </script>
</body>
</html>
