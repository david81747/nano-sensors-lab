<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>最新消息 | 奈米感測實驗室</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        /* ================= 原生文章版面設計 ================= */
        .article-container { 
            max-width: 800px; /* 縮減寬度讓閱讀視角更集中舒適 */
            margin: 4rem auto; 
            padding: 4rem; 
            background: #fff; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        .article-title { 
            font-size: 2.2rem; 
            color: var(--primary-purple); 
            margin-bottom: 1rem; 
            line-height: 1.4; 
            font-weight: bold; 
        }
        .article-date { 
            color: #888; 
            font-size: 1rem; 
            margin-bottom: 2rem; 
            border-bottom: 2px solid #f0f0f0; 
            padding-bottom: 1rem; 
        }
        
        /* 封面圖片設計 */
        .native-cover-img { 
            width: 100%; 
            max-height: 450px; 
            object-fit: cover; 
            border-radius: 8px; 
            margin-bottom: 2.5rem; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            background-color: #f9f9f9;
        }

        /* 原生內文排版 (像看 Medium 或質感部落格) */
        .native-article-body { 
            font-size: 1.15rem; 
            line-height: 1.9; 
            color: #333; 
            text-align: justify; 
            letter-spacing: 0.5px;
        }
        .native-article-body p { margin-bottom: 1.5rem; }

        /* 按鈕設計 */
        .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 3rem; flex-wrap: wrap; }
        .back-btn { padding: 10px 25px; background: #eee; color: #555; text-decoration: none; border-radius: 30px; font-weight: bold; transition: 0.3s; }
        .back-btn:hover { background: #ddd; }

        /* 載入動畫 */
        .loader-spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-purple); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 2rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ================= 手機版專屬優化 ================= */
        @media (max-width: 768px) {
            .page-section { padding-top: 80px !important; padding-left: 0 !important; padding-right: 0 !important; }
            .article-container { 
                margin: 0 !important; 
                padding: 30px 20px !important; 
                border-radius: 0; 
                box-shadow: none; 
            }
            .article-title { font-size: 1.7rem; }
            .native-cover-img { max-height: 250px; margin-bottom: 1.5rem; border-radius: 6px; }
            .native-article-body { font-size: 1.05rem; line-height: 1.7; }
            .btn-group { flex-direction: column; width: 100%; }
            .btn-group a { text-align: center; width: 100%; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html"><img src="images/logo.png" alt="奈米感測實驗室"></a></div>
        <div class="menu-toggle" id="mobile-menu">☰</div>
        <ul id="nav-menu">
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於實驗室</a></li>
            <li><a href="professor.html">指導教授</a></li>
            <li><a href="members.html">團隊成員</a></li>
            <li><a href="research.html">研究成果</a></li>
        </ul>
    </nav>

    <section class="page-section gray-bg">
        <div class="article-container" id="article-body">
            <div style="text-align: center; padding: 4rem 0;">
                <div class="loader-spinner"></div>
                <p style="color: #666; margin-top: 15px; font-weight: bold;">正在載入最新消息...</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="sponsors-area">
            <h4>產學合作 / 合作廠商</h4>
            <div class="sponsor-logos">
                <div>廠商 Logo 1</div><div>廠商 Logo 2</div>
            </div>
        </div>
        <div class="footer-divider"></div>
        <div class="contact-area">
            <h4>聯絡我們</h4>
            <div class="contact-info-row">
                <p>電話：06-2606123 # 7012</p>
                <p>信箱：shwu@mail.nutn.edu.tw</p>
                <p>地址：701臺南市東區榮譽街67號 ZA107-2室 (榮譽校區)</p>
            </div>
        </div>
        <div class="copyright"><p>&copy; 2026 國立臺南大學 電機工程學系 奈米感測實驗室. All Rights Reserved.</p></div>
    </footer>

    <script>
        // 漢堡選單邏輯
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');
        if(mobileMenu && navMenu) {
            mobileMenu.addEventListener('click', () => { navMenu.classList.toggle('active'); });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const articleTitle = urlParams.get('title');
        const scriptUrl = "https://script.google.com/macros/s/AKfycby6nER3S_UDSxUI6xuf5dh3erxRL4eqDlDSgIz09OL9f4PhDTuV8CS2X_8RDsoEAAGmOA/exec";

        fetch(scriptUrl)
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('article-body');
                const article = data.find(item => item.title === articleTitle);

                if (article) {
                    // 1. 處理日期
                    let dateStr = "";
                    if (article.date) {
                        const d = new Date(article.date);
                        dateStr = isNaN(d.getTime()) ? article.date : d.toLocaleDateString('zh-TW');
                    }

                    // 2. 處理內文：將試算表中的換行符號 (\n) 自動轉換為網頁的段落 (<br><br>)
                    const rawContent = article.content ? article.content.trim() : '尚未提供詳細內容。';
                    const formattedContent = rawContent.replace(/\n/g, '<br><br>');

                    // 3. 處理封面圖片：自動解析 Google Drive 圖片
                    let imgHtml = '';
                    if (article.image) {
                        if (article.image.includes('drive.google.com')) {
                            const match = article.image.match(/[-\w]{25,}/);
                            if (match) imgHtml = `<img src="https://drive.google.com/thumbnail?id=${match[0]}&sz=w1000" class="native-cover-img" alt="封面圖片">`;
                        } else {
                            imgHtml = `<img src="${article.image}" class="native-cover-img" alt="封面圖片">`;
                        }
                    }

                    // 4. 組合出真正的網頁 (附件按鈕已移除)
                    container.innerHTML = `
                        <h1 class="article-title">${article.title}</h1>
                        <div class="article-date">${dateStr}</div>
                        ${imgHtml}
                        <div class="native-article-body">
                            ${formattedContent}
                        </div>
                        <div class="btn-group">
                            <a href="index.html#news" class="back-btn">❮ 返回最新消息</a>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<div style="text-align:center;"><h2>找不到該篇文章</h2><a href="index.html#news" class="back-btn" style="margin-top:20px;">回首頁</a></div>';
                }
            })
            .catch(error => {
                document.getElementById('article-body').innerHTML = '<p style="text-align:center; color:red;">資料載入失敗，請確認網路連線。</p>';
            });
    </script>
</body>
</html>
