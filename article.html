<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新消息 | 奈米感測實驗室</title>
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .article-container { max-width: 900px; margin: 4rem auto; padding: 3rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .article-title { font-size: 2rem; color: var(--primary-purple); margin-bottom: 1rem; line-height: 1.3; }
        .article-date { color: #888; font-size: 0.95rem; margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        
        .back-btn { display: inline-block; margin-top: 2rem; padding: 10px 20px; background: var(--accent-pink); color: #fff; text-decoration: none; border-radius: 4px; transition: 0.3s; text-align: center; }
        .back-btn:hover { background: #d81b60; }

        /* ================= 原生渲染 (Native Rendering) 強制排版 ================= */
        /* 這些 CSS 會強制蓋過 Google Docs 隱藏的排版設定，讓它 100% 聽我們的話 */
        .native-doc-wrapper {
            width: 100%;
            overflow-x: hidden; /* 防止內容撐破螢幕 */
            color: #333;
            line-height: 1.8;
            font-size: 1.1rem;
        }
        
        /* 強制所有圖片、表格、區塊最大只能 100% 寬度 */
        .native-doc-wrapper * {
            max-width: 100% !important;
            height: auto !important; /* 保持圖片比例 */
            box-sizing: border-box !important;
        }

        /* 打破 Google Docs 的強制不換行或死板的寬度 */
        .native-doc-wrapper p, 
        .native-doc-wrapper span, 
        .native-doc-wrapper td {
            white-space: normal !important; 
            word-break: break-word !important; 
        }

        /* 處理隱形表格：讓表格可以水平滑動，不會撐壞整個網頁 */
        .native-doc-wrapper table {
            width: 100% !important;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ================= 手機版專屬極致滿版優化 ================= */
        @media (max-width: 768px) {
            .page-section { padding-left: 0 !important; padding-right: 0 !important; }
            .article-container { 
                margin: 0 !important; 
                padding: 20px !important; /* 改用原生渲染後，可以給一點內距讓閱讀更舒服 */
                border-radius: 0; 
                box-shadow: none; 
            }
            .article-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html"><img src="images/logo.png" alt="奈米感測實驗室"></a></div>
        <div class="menu-toggle" id="mobile-menu">☰</div>
        <ul id="nav-menu">
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於實驗室</a></li>
            <li><a href="professor.html">指導教授</a></li>
            <li><a href="members.html">團隊成員</a></li>
            <li><a href="research.html">研究成果</a></li>
        </ul>
    </nav>

    <section class="page-section gray-bg">
        <div class="article-container" id="article-body">
            <p style="text-align: center; color: #666; padding: 3rem 0;">文章載入中，請稍候...</p>
        </div>
    </section>

    <footer>
        <div class="sponsors-area">
            <h4>產學合作 / 合作廠商</h4>
            <div class="sponsor-logos">
                <div>廠商 Logo 1</div><div>廠商 Logo 2</div>
            </div>
        </div>
        <div class="footer-divider"></div>
        <div class="contact-area">
            <h4>聯絡我們</h4>
            <div class="contact-info-row">
                <p>電話：06-2606123 # 7012</p>
                <p>信箱：shwu@mail.nutn.edu.tw</p>
                <p>地址：701臺南市東區榮譽街67號 ZA107-2室 (榮譽校區)</p>
            </div>
        </div>
        <div class="copyright"><p>&copy; 2026 國立臺南大學 電機工程學系 奈米感測實驗室. All Rights Reserved.</p></div>
    </footer>

    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');
        if(mobileMenu && navMenu) {
            mobileMenu.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const articleTitle = urlParams.get('title');
        const scriptUrl = "https://script.google.com/macros/s/AKfycby6nER3S_UDSxUI6xuf5dh3erxRL4eqDlDSgIz09OL9f4PhDTuV8CS2X_8RDsoEAAGmOA/exec";

        fetch(scriptUrl)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('article-body');
                const article = data.find(item => item.title === articleTitle);

                if (article) {
                    let dateStr = "";
                    if (article.date) {
                        const d = new Date(article.date);
                        dateStr = isNaN(d.getTime()) ? article.date : d.toLocaleDateString('zh-TW');
                    }

                    // 基本框架準備好
                    container.innerHTML = `
                        <h1 class="article-title">${article.title}</h1>
                        <div class="article-date">${dateStr}</div>
                        <div id="dynamic-content-area" style="min-height: 300px; text-align: center; color: #888;">
                            <img src="https://i.gifer.com/ZZ5H.gif" alt="loading" style="width: 30px; margin-top: 50px;">
                            <p>正在為您抽取文章內容...</p>
                        </div>
                        <div style="text-align: center; margin-top: 2rem;">
                            <a href="index.html#news" class="back-btn">回最新消息</a>
                        </div>
                    `;

                    const contentArea = document.getElementById('dynamic-content-area');
                    let targetUrl = article.link;

                    // 備用方案：如果擷取失敗，退回使用 iframe
                    const fallbackIframe = `<iframe src="${targetUrl}${targetUrl.includes('?') ? '&' : '?'}embedded=true" style="width: 100%; height: 80vh; border: none; background: #f9f9f9;"></iframe>`;

                    if (targetUrl && targetUrl.includes('/pub')) {
                        // 使用中介 API (CORS Proxy) 來抓取 Google Docs 的網頁原始碼
                        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                        
                        fetch(proxyUrl)
                            .then(res => res.json())
                            .then(htmlData => {
                                if(htmlData.contents) {
                                    // 將抓到的純文字轉化為真實的 HTML 節點
                                    const parser = new DOMParser();
                                    const doc = parser.parseFromString(htmlData.contents, 'text/html');
                                    
                                    // 找出 Google Docs 裝載真實內容的區塊 (通常是 id="contents")
                                    const extractedContent = doc.querySelector('#contents') || doc.body;
                                    
                                    // 將抽出來的純淨內容塞進我們自己的網頁，並套用嚴格的 CSS 規範
                                    contentArea.innerHTML = `<div class="native-doc-wrapper">${extractedContent.innerHTML}</div>`;
                                    contentArea.style.textAlign = 'left';
                                } else {
                                    contentArea.innerHTML = fallbackIframe;
                                }
                            })
                            .catch(err => {
                                // 如果網路阻擋，無縫切換回 iframe
                                contentArea.innerHTML = fallbackIframe;
                            });
                    } else {
                        // 如果這不是 /pub 網址，直接用 iframe
                        contentArea.innerHTML = fallbackIframe;
                    }
                } else {
                    container.innerHTML = '<h2>找不到該篇文章</h2><a href="index.html#news" class="back-btn">回首頁</a>';
                }
            })
            .catch(error => {
                document.getElementById('article-body').innerHTML = '<p>資料載入失敗，請稍後再試。</p>';
            });
    </script>
</body>
</html>
