<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新消息 | 奈米感測實驗室</title>
    <!-- 維持 v=6 確保讀取到全站最新的導覽列修正 -->
    <link rel="stylesheet" href="style.css?v=6">
    <style>
        .article-container { max-width: 900px; margin: 4rem auto; padding: 3rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .article-title { font-size: 2rem; color: var(--primary-purple); margin-bottom: 1rem; line-height: 1.3; }
        .article-date { color: #888; font-size: 0.95rem; margin-bottom: 2rem; border-bottom: 1px solid #eee; padding-bottom: 1rem; }
        
        /* 設定嵌入 Google Docs 的框架樣式 */
        .doc-frame { width: 100%; height: 80vh; border: none; border-radius: 4px; background: #f9f9f9; }
        
        .back-btn { display: inline-block; margin-top: 2rem; padding: 10px 20px; background: var(--accent-pink); color: #fff; text-decoration: none; border-radius: 4px; transition: 0.3s; text-align: center; }
        .back-btn:hover { background: #d81b60; }

        /* ================= 手機版內文專屬極致滿版優化 ================= */
        @media (max-width: 768px) {
            /* 1. 強制抵銷 style.css 裡面的灰色背景左右 5% 留白 */
            .page-section {
                padding-left: 0 !important;
                padding-right: 0 !important;
            }
            /* 2. 卡片完全貼齊螢幕，去除所有多餘內距與陰影，把空間全讓給文件 */
            .article-container { 
                margin: 0 !important; 
                padding: 20px 0 !important; /* 左右內距設為 0 */
                border-radius: 0; 
                box-shadow: none; 
            }
            /* 3. 單獨讓標題與日期維持左右邊距，才不會貼死螢幕邊緣 */
            .article-title, .article-date { 
                padding-left: 20px; 
                padding-right: 20px; 
            }
            .article-title { 
                font-size: 1.5rem; 
            }
            /* 4. Google Docs 框架獲得 100% 的手機螢幕寬度，並稍微增加高度 */
            .doc-frame { 
                height: 85vh; 
                border-radius: 0;
                border-top: 1px solid #eee;
                border-bottom: 1px solid #eee;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html"><img src="images/logo.png" alt="奈米感測實驗室"></a></div>
        
        <!-- 手機版漢堡按鈕 -->
        <div class="menu-toggle" id="mobile-menu">☰</div>
        
        <ul id="nav-menu">
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於實驗室</a></li>
            <li><a href="professor.html">指導教授</a></li>
            <li><a href="members.html">團隊成員</a></li>
            <li><a href="research.html">研究成果</a></li>
        </ul>
    </nav>

    <section class="page-section gray-bg">
        <div class="article-container" id="article-body">
            <p style="text-align: center; color: #666;">文章載入中...</p>
        </div>
    </section>

    <footer>
        <div class="sponsors-area">
            <h4>產學合作 / 合作廠商</h4>
            <div class="sponsor-logos">
                <div>廠商 Logo 1</div><div>廠商 Logo 2</div>
            </div>
        </div>
        <div class="footer-divider"></div>
        <div class="contact-area">
            <h4>聯絡我們</h4>
            <div class="contact-info-row">
                <p>電話：06-2606123 # 7012</p>
                <p>信箱：shwu@mail.nutn.edu.tw</p>
                <p>地址：701臺南市東區榮譽街67號 ZA107-2室 (榮譽校區)</p>
            </div>
        </div>
        <div class="copyright"><p>&copy; 2026 國立臺南大學 電機工程學系 奈米感測實驗室. All Rights Reserved.</p></div>
    </footer>

    <!-- Google Sheets API 動態讀取與漢堡選單腳本 -->
    <script>
        // 漢堡選單切換邏輯
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');
        if(mobileMenu && navMenu) {
            mobileMenu.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }

        const urlParams = new URLSearchParams(window.location.search);
        const articleTitle = urlParams.get('title');

        const scriptUrl = "https://script.google.com/macros/s/AKfycby6nER3S_UDSxUI6xuf5dh3erxRL4eqDlDSgIz09OL9f4PhDTuV8CS2X_8RDsoEAAGmOA/exec";

        fetch(scriptUrl)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('article-body');
                const article = data.find(item => item.title === articleTitle);

                if (article) {
                    let dateStr = "";
                    if (article.date) {
                        const d = new Date(article.date);
                        dateStr = isNaN(d.getTime()) ? article.date : d.toLocaleDateString('zh-TW');
                    }

                    // 防呆機制：自動偵測 Google Docs 網址並加入嵌入參數
                    let finalLink = article.link;
                    if (finalLink && finalLink.includes('docs.google.com') && !finalLink.includes('embedded=true')) {
                        finalLink += (finalLink.includes('?') ? '&' : '?') + 'embedded=true';
                    }

                    const contentHtml = finalLink 
                        ? `<iframe src="${finalLink}" class="doc-frame" title="${article.title}"></iframe>` 
                        : `<div style="padding: 2rem; text-align: center; color: #888;">尚未提供文章內容</div>`;

                    container.innerHTML = `
                        <h1 class="article-title">${article.title}</h1>
                        <div class="article-date">${dateStr}</div>
                        ${contentHtml}
                        <div style="text-align: center; margin-bottom: 1rem;">
                            <a href="index.html#news" class="back-btn">回最新消息</a>
                        </div>
                    `;
                } else {
                    container.innerHTML = '<h2>找不到該篇文章</h2><a href="index.html#news" class="back-btn">回首頁</a>';
                }
            })
            .catch(error => {
                document.getElementById('article-body').innerHTML = '<p>資料載入失敗，請稍後再試。</p>';
            });
    </script>
</body>
</html>
