<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研究成果 | 奈米感測實驗室</title>
    <!-- 修正 1：補上最新的 CSS 版本號確保選單完美置中 -->
    <link rel="stylesheet" href="style.css?v=5">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--primary-purple); color: #fff; font-weight: bold; }
        tr:hover { background-color: #f9f9f9; }
    </style>
</head>
<body>

    <!-- 修正 2 & 3：加入漢堡按鈕、ID，並將「研究成果」高亮 -->
    <nav>
        <div class="logo"><a href="index.html"><img src="images/logo.png" alt="奈米感測實驗室"></a></div>
        
        <!-- 手機版漢堡按鈕 -->
        <div class="menu-toggle" id="mobile-menu">☰</div>
        
        <ul id="nav-menu">
            <li><a href="index.html">首頁</a></li>
            <li><a href="about.html">關於實驗室</a></li>
            <li><a href="professor.html">指導教授</a></li>
            <li><a href="members.html">團隊成員</a></li>
            <li><a href="research.html" style="color: #8e24aa; font-weight: bold;">研究成果</a></li>
        </ul>
    </nav>

    <section class="page-section gray-bg">
        <h2 class="section-title">研究成果</h2>

        <h3 style="font-size: 1.5rem; color: var(--primary-purple); margin-bottom: 1rem;">歷年論文與專案</h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 100px;">年度</th>
                    <th style="width: 150px;">發表者</th>
                    <th>研究主題與成果名稱</th>
                </tr>
            </thead>
            <tbody id="research-table-body">
                <tr><td colspan="3" style="text-align: center; color: #888;">資料載入中...</td></tr>
            </tbody>
        </table>
    </section>

    <!-- 修正 4：補齊完整的頁尾 -->
    <footer>
        <div class="sponsors-area">
            <h4>產學合作 / 合作廠商</h4>
            <div class="sponsor-logos">
                <div>廠商 Logo 1</div><div>廠商 Logo 2</div>
            </div>
        </div>
        <div class="footer-divider"></div>
        <div class="contact-area">
            <h4>聯絡我們</h4>
            <div class="contact-info-row">
                <p>電話：06-2606123 # 7012</p>
                <p>信箱：shwu@mail.nutn.edu.tw</p>
                <p>地址：701臺南市東區榮譽街67號 ZA107-2室 (榮譽校區)</p>
            </div>
        </div>
        <div class="copyright"><p>&copy; 2026 國立臺南大學 電機工程學系 奈米感測實驗室. All Rights Reserved.</p></div>
    </footer>

    <script>
        // 修正 5：漢堡選單切換邏輯
        const mobileMenu = document.getElementById('mobile-menu');
        const navMenu = document.getElementById('nav-menu');
        
        if(mobileMenu && navMenu) {
            mobileMenu.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }

        // 這裡加上了 ?sheet=研究成果 來告訴 API 我們要抓哪個分頁
        const scriptUrl = "https://script.google.com/macros/s/AKfycby6nER3S_UDSxUI6xuf5dh3erxRL4eqDlDSgIz09OL9f4PhDTuV8CS2X_8RDsoEAAGmOA/exec?sheet=研究成果";

        fetch(scriptUrl)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('research-table-body');
                tbody.innerHTML = ''; 

                // 讓年份最新的排在最上面
                data.sort((a, b) => b.year - a.year).forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.year}</td>
                        <td>${item.author}</td>
                        <td>${item.title}</td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(error => {
                document.getElementById('research-table-body').innerHTML = '<tr><td colspan="3" style="text-align: center;">資料載入失敗</td></tr>';
            });
    </script>
</body>
</html>
